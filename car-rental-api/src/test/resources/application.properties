# Test điều khiển mốc dọn chủ động; job nền không được tự sửa fixture có ngày cũ.
# Chỉ nằm trong test classpath, không được đóng gói vào ứng dụng local.
# Wiring và lịch chạy thật được kiểm riêng trong ReservationHoldExpirySchedulerTest.
# Job vẫn được đăng ký; độ trễ ban đầu bằng nhịp 24 giờ, dài hơn thời gian chạy suite.
car-rental.availability.hold-sweep-interval=PT24H

# Dữ liệu bảo hiểm thử theo BR-231, chỉ trên test classpath; không phải mặc định của app.
car-rental.pricing.insurance.calculation=PER_BILLING_DAY
car-rental.pricing.insurance.value=100000

# Client giả cho context test: không đọc .env và không dùng credential/Keycloak local.
# Test adapter chặn HTTP bằng MockRestServiceServer; startup không gọi Keycloak.
car-rental.identity.keycloak.base-url=http://keycloak.invalid
car-rental.identity.keycloak.realm=car-rental-test
car-rental.identity.keycloak.reader-client-id=identity-reader-test
car-rental.identity.keycloak.reader-secret=test-only-not-a-real-secret

# Không kết nối MinIO local. Test storage thật thay bằng container riêng qua DynamicPropertySource.
car-rental.storage.endpoint=http://storage.invalid:9000
car-rental.storage.bucket=documents-test
car-rental.storage.access-key=documents-test-app
car-rental.storage.secret-key=test-only-storage-secret

# Khoá công khai chỉ dành cho test, không phải cấu hình/mặc định production hoặc local.
car-rental.identity.documents.crypto.key-version=1
car-rental.identity.documents.crypto.encryption-key=AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
car-rental.identity.documents.crypto.hash-key=ICEiIyQlJicoKSorLC0uLzAxMjM0NTY3ODk6Ozw9Pj8=
