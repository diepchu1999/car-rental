services:
  postgres:
    image: "${POSTGRES_IMAGE:?POSTGRES_IMAGE is required}"
    platform: "${POSTGRES_PLATFORM:?POSTGRES_PLATFORM is required}"
    restart: unless-stopped
    command:
      - postgres
      - -c
      - "port=${POSTGRES_PORT:?POSTGRES_PORT is required}"
    environment:
      POSTGRES_USER: "${POSTGRES_ADMIN_USER:?POSTGRES_ADMIN_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}"
      POSTGRES_DB: "${POSTGRES_MAINTENANCE_DB:?POSTGRES_MAINTENANCE_DB is required}"
      POSTGRES_PORT: "${POSTGRES_PORT:?POSTGRES_PORT is required}"
      POSTGRES_APP_DB: "${POSTGRES_APP_DB:?POSTGRES_APP_DB is required}"
      POSTGRES_APP_USER: "${POSTGRES_APP_USER:?POSTGRES_APP_USER is required}"
      POSTGRES_APP_PASSWORD: "${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}"
      KEYCLOAK_DB: "${KEYCLOAK_DB:?KEYCLOAK_DB is required}"
      KEYCLOAK_DB_USER: "${KEYCLOAK_DB_USER:?KEYCLOAK_DB_USER is required}"
      KEYCLOAK_DB_PASSWORD: "${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}"
    ports:
      - "${LOCAL_BIND_ADDRESS:?LOCAL_BIND_ADDRESS is required}:${POSTGRES_PORT:?POSTGRES_PORT is required}:${POSTGRES_PORT:?POSTGRES_PORT is required}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init/20-create-databases.sh:/docker-entrypoint-initdb.d/20-create-databases.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready
          --host=127.0.0.1
          --username "$${POSTGRES_USER}"
          --dbname "$${POSTGRES_DB}"
          --port "$${POSTGRES_PORT}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    stop_grace_period: 30s

  keycloak:
    image: "${KEYCLOAK_IMAGE:?KEYCLOAK_IMAGE is required}"
    restart: unless-stopped
    command:
      - start-dev
      - --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: "${POSTGRES_PORT:?POSTGRES_PORT is required}"
      KC_DB_URL_DATABASE: "${KEYCLOAK_DB:?KEYCLOAK_DB is required}"
      KC_DB_USERNAME: "${KEYCLOAK_DB_USER:?KEYCLOAK_DB_USER is required}"
      KC_DB_PASSWORD: "${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}"
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_ADMIN_USERNAME:?KEYCLOAK_ADMIN_USERNAME is required}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}"
      KC_HTTP_PORT: "${KEYCLOAK_PORT:?KEYCLOAK_PORT is required}"
      KC_HTTP_MANAGEMENT_PORT: "${KEYCLOAK_MANAGEMENT_PORT:?KEYCLOAK_MANAGEMENT_PORT is required}"
      KC_HEALTH_ENABLED: "true"
      # BR-129: cấu hình vận hành; provider tự kiểm hợp lệ, không có mặc định ngầm.
      CAR_RENTAL_OTP_DIGITS: "${CAR_RENTAL_OTP_DIGITS:?CAR_RENTAL_OTP_DIGITS is required}"
      CAR_RENTAL_OTP_LIFETIME: "${CAR_RENTAL_OTP_LIFETIME:?CAR_RENTAL_OTP_LIFETIME is required}"
      CAR_RENTAL_OTP_MAX_FAILURES: "${CAR_RENTAL_OTP_MAX_FAILURES:?CAR_RENTAL_OTP_MAX_FAILURES is required}"
      CAR_RENTAL_OTP_RESEND_DELAY: "${CAR_RENTAL_OTP_RESEND_DELAY:?CAR_RENTAL_OTP_RESEND_DELAY is required}"
      CAR_RENTAL_OTP_PHONE_HOURLY_LIMIT: "${CAR_RENTAL_OTP_PHONE_HOURLY_LIMIT:?CAR_RENTAL_OTP_PHONE_HOURLY_LIMIT is required}"
      CAR_RENTAL_OTP_PHONE_DAILY_LIMIT: "${CAR_RENTAL_OTP_PHONE_DAILY_LIMIT:?CAR_RENTAL_OTP_PHONE_DAILY_LIMIT is required}"
      CAR_RENTAL_OTP_IP_SEND_HOURLY_LIMIT: "${CAR_RENTAL_OTP_IP_SEND_HOURLY_LIMIT:?CAR_RENTAL_OTP_IP_SEND_HOURLY_LIMIT is required}"
      CAR_RENTAL_OTP_IP_FAILURE_HOURLY_LIMIT: "${CAR_RENTAL_OTP_IP_FAILURE_HOURLY_LIMIT:?CAR_RENTAL_OTP_IP_FAILURE_HOURLY_LIMIT is required}"
      CAR_RENTAL_OTP_HMAC_SECRET: "${CAR_RENTAL_OTP_HMAC_SECRET:?CAR_RENTAL_OTP_HMAC_SECRET is required}"
      CAR_RENTAL_TERMS_VERSION: "${CAR_RENTAL_TERMS_VERSION:?CAR_RENTAL_TERMS_VERSION is required}"
      # Secret chỉ lấy từ .env; Keycloak thay placeholder khi import realm lần đầu.
      CAR_RENTAL_KEYCLOAK_READER_SECRET: "${CAR_RENTAL_KEYCLOAK_READER_SECRET:?CAR_RENTAL_KEYCLOAK_READER_SECRET is required}"
      CAR_RENTAL_LOCAL_ADMIN_PASSWORD: "${CAR_RENTAL_LOCAL_ADMIN_PASSWORD:?CAR_RENTAL_LOCAL_ADMIN_PASSWORD is required}"
      CAR_RENTAL_LOCAL_STAFF_PASSWORD: "${CAR_RENTAL_LOCAL_STAFF_PASSWORD:?CAR_RENTAL_LOCAL_STAFF_PASSWORD is required}"
      CAR_RENTAL_LOCAL_MANAGER_A_PASSWORD: "${CAR_RENTAL_LOCAL_MANAGER_A_PASSWORD:?CAR_RENTAL_LOCAL_MANAGER_A_PASSWORD is required}"
      CAR_RENTAL_LOCAL_MANAGER_B_PASSWORD: "${CAR_RENTAL_LOCAL_MANAGER_B_PASSWORD:?CAR_RENTAL_LOCAL_MANAGER_B_PASSWORD is required}"
    ports:
      - "${LOCAL_BIND_ADDRESS:?LOCAL_BIND_ADDRESS is required}:${KEYCLOAK_PORT:?KEYCLOAK_PORT is required}:${KEYCLOAK_PORT:?KEYCLOAK_PORT is required}"
    volumes:
      # Chỉ mount đúng hai JAR triển khai, tuyệt đối không mount cả target/ có JAR probe.
      - type: bind
        source: ../car-rental-keycloak/target/car-rental-keycloak-0.0.1-SNAPSHOT.jar
        target: /opt/keycloak/providers/car-rental-otp.jar
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../car-rental-keycloak/target/car-rental-keycloak-0.0.1-SNAPSHOT-local-sms.jar
        target: /opt/keycloak/providers/car-rental-local-sms.jar
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./keycloak/realm-export.json
        target: /opt/keycloak/data/import/car-rental-realm.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /usr/bin/bash
        - -c
        - >-
          { printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0;
          grep -q 'HTTP/1.0 200'; }
          0<>/dev/tcp/127.0.0.1/$${KC_HTTP_MANAGEMENT_PORT}
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    stop_grace_period: 30s

  minio:
    image: "${MINIO_IMAGE:?MINIO_IMAGE is required}"
    restart: unless-stopped
    command:
      - server
      - /data
      - --address
      - ":${MINIO_API_PORT:?MINIO_API_PORT is required}"
      - --console-address
      - ":${MINIO_CONSOLE_PORT:?MINIO_CONSOLE_PORT is required}"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}"
    ports:
      - "${LOCAL_BIND_ADDRESS:?LOCAL_BIND_ADDRESS is required}:${MINIO_API_PORT:?MINIO_API_PORT is required}:${MINIO_API_PORT:?MINIO_API_PORT is required}"
      - "${LOCAL_BIND_ADDRESS:?LOCAL_BIND_ADDRESS is required}:${MINIO_CONSOLE_PORT:?MINIO_CONSOLE_PORT is required}:${MINIO_CONSOLE_PORT:?MINIO_CONSOLE_PORT is required}"
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        - CMD
        - mc
        - ready
        - local
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    stop_grace_period: 30s

volumes:
  postgres_data:
  minio_data:
